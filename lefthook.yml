# Checks before every commit (`docs/DECISIONS.md`): each job runs when the commit touches its part of
# the repo. The Swift checks run on GitHub instead, on our Mac minis (`.github/workflows/swift-check.yml`).
# Set up once per clone with `lefthook install`; skip in an emergency with `LEFTHOOK=0 git commit …`.
# Nothing runs before a push: Pixelbook, which used to render and publish there, is published by
# CI from the committed state catalog images (851-2955).

pre-commit:
  parallel: true
  jobs:
    # Pixelbook's graph files name state catalogs and their states (from the catalogs' manifests),
    # so renaming one in Swift is checked against them.
    - name: pixelbook
      run: scripts/check --hook --pixelbook
      glob:
        - "LilPackage/Tests/*/Catalogs/**/*.swift"
        - "LilPackage/Tests/*/Catalogs/**/*.json"
        - "Web/pixelbook/graphs/**"
        - "Web/pixelbook/src/lib/Graph.ts"
        - "Web/pixelbook/scripts/graphs.ts"
        - "scripts/check"
    - name: services
      run: scripts/check --hook --services
      glob:
        - "Services/**"
        - "Web/**"
        - "package.json"
        - "pnpm-workspace.yaml"
        - "pnpm-lock.yaml"
        - ".node-version"
        - "vite.config.ts"
        - "tsconfig.json"
        - "tsconfig.base.json"
        # The apps' Info.plists, which a test checks against the server's Google client IDs.
        - "Apps/LilHealth/*-Info.plist"
        # The generated client's stamp covers the generator's pin and config.
        - "Tools/Package.*"
        - "Tools/openapi-generator-config.yaml"
        - "scripts/format"
        - "scripts/check"
        - "scripts/generate-api-client"
        - "scripts/check-deploy"
        - "LilPackage/Sources/LilAPIGenerated/**"
        - "lefthook.yml"
