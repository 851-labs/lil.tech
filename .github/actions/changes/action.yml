name: Changes
description: >-
  Whether the site changed since a commit, so pr.yml and main.yml deploy it only when it did.
  Fetches the base commit itself, so a checkout of HEAD alone will do.
inputs:
  base:
    description: The commit to compare HEAD with. If it's missing or unknown, everything counts as changed.
    required: false
    default: ""
outputs:
  site:
    description: '"true" if the site, its stack or what deploys them is affected.'
    value: ${{ steps.diff.outputs.site }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        # The TypeScript workspace (the site and its stack, with the root config) and the CI files
        # that deploy it.
        SITE: '^(Web/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.node-version$|vite\.config\.ts$|tsconfig\.json$|tsconfig\.base\.json$|\.github/workflows/(pr|main)\.yml$|\.github/actions/(setup|changes|comment|check-deploy)/)'
      run: |
        # The diff compares the two commits' trees, so the base alone will do, without its history.
        # The checkout is HEAD alone, so it's never there yet.
        if [ -n "$BASE" ] && ! git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
          echo "::notice::Couldn't fetch the base, $BASE, so everything counts as changed."
        fi
        # No base, or one that couldn't be fetched (a run by hand): everything changed.
        if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "site=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Without rename detection, so a file moved out of the site counts as a change there too
        # (its old path, as deleted), not only where it went.
        files=$(git diff --no-renames --name-only "$BASE" HEAD)
        if grep -qE "$SITE" <<< "$files"; then echo "site=true"; else echo "site=false"; fi >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"
