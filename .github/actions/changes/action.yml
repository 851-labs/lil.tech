name: Changes
description: >-
  Which parts of the repo changed since a commit, so pr.yml and main.yml run only the jobs they
  affect. Fetches the base commit itself, so a checkout of HEAD alone will do, rather than one of
  every branch and tag, which lists each in the log (851-4052).
inputs:
  base:
    description: The commit to compare HEAD with. If it's missing or unknown, everything counts as changed.
    required: false
    default: ""
outputs:
  swift:
    description: '"true" if the Swift checks (`scripts/check --swift`) are affected.'
    value: ${{ steps.diff.outputs.swift }}
  services:
    description: '"true" if the TypeScript workspace, which the services deploy, is affected.'
    value: ${{ steps.diff.outputs.services }}
  iphone:
    description: '"true" if the iPhone''s state catalogs (`scripts/snapshot --iphone`) are affected.'
    value: ${{ steps.diff.outputs.iphone }}
  healthkit:
    description: '"true" if the iPhone''s HealthKit tests (`scripts/test-iphone-healthkit`) are affected.'
    value: ${{ steps.diff.outputs.healthkit }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        # The paths `scripts/check --swift` checks (with the server's copy of the Health catalog
        # and its card files, which it compares with the Swift ones, and the Health toolkit's tools and conformance
        # cases, the cards' conformance cases and the card tools', which the Mac's tests read), and the CI files that run it.
        SWIFT: '^(LilPackage/|Apps/|Tools/|Lil\.xcworkspace/|\.swift-format$|scripts/(format|check|ci-shell|test-ci-shell|snapshot|compilation-cache|swift|xcodebuild|test-iphone-healthkit|snapshot-sheet|test-snapshot-sheet|contact-sheet|collect-snapshots|check-iphone-paths|generate-health-catalog|generate-health-cards)$|Services/api/health-catalog\.json$|Services/api/card-spec\.schema\.json$|Services/api/card-seed\.json$|Services/api/time-zones\.json$|Services/api/test/health/cards/validation-cases\.json$|Services/api/mcp-tools\.json$|Services/api/test/health/tools/conformance/|Services/api/test/health/cards/conformance/|Services/api/test/health/cards/tool-conformance/|\.github/workflows/(pr|main|swift-check)\.yml$|\.github/actions/(changes|select-xcode)/)'
        # What the iPhone's snapshot tests are built from: the modules HealthPhoneSnapshotTests
        # depends on, with theirs (`PhoneSnapshots.xcodeproj`), its sources, the shared catalogs and
        # snapshot support it builds from HealthSnapshotTests, the package's manifest and pins, and
        # the CI files and script that run it. `scripts/check --swift` fails when it misses one
        # of those modules (`scripts/check-iphone-paths`), so a new dependency must be added here.
        IPHONE: '^(LilPackage/Sources/Health/(HealthCardEditor|HealthCardStore|HealthCards|HealthCatalog|HealthDatabase|HealthKitAccess|HealthPhoneApp|HealthUI|HealthUpload)/|LilPackage/Sources/Lil/(LilAPI|LilAPIGenerated|LilAuth|LilGzip|LilSync|LilUI)/|LilPackage/Tests/Health/(HealthPhoneSnapshotTests|PhoneSnapshots)/|LilPackage/Tests/Health/HealthSnapshotTests/(Catalogs/LilAuth/|StateCatalog\.swift$|SnapshotOutput\.swift$)|LilPackage/Package\.(swift|resolved)$|Lil\.xcworkspace/|scripts/(snapshot|compilation-cache|swift|xcodebuild|collect-snapshots|ci-shell)$|\.github/workflows/(pr|swift-check)\.yml$|\.github/actions/(changes|select-xcode)/)'
        # What the iPhone's HealthKit tests (851-3201) are built from and read: the modules
        # `PhoneHealthKit.xcodeproj` links, with theirs, its sources and the conformance files it
        # builds and reads, the cards' conformance cases and dataset with the tools' it extends,
        # the package's manifest and pins, and the CI files and script that run them.
        HEALTHKIT: '^(LilPackage/Sources/Health/(HealthCards|HealthCatalog|HealthKitAccess|HealthUpload)/|LilPackage/Sources/Lil/(LilAPI|LilAPIGenerated|LilGzip)/|LilPackage/Tests/Health/(HealthKitPhoneTests|PhoneHealthKit|HealthConformance)/|Services/api/test/health/(cards|tools)/conformance/|LilPackage/Package\.(swift|resolved)$|Lil\.xcworkspace/|scripts/(test-iphone-healthkit|compilation-cache|xcodebuild|ci-shell)$|\.github/workflows/(pr|main|swift-check)\.yml$|\.github/actions/(changes|select-xcode)/)'
        # The TypeScript workspace, the scripts and generated client the deploys use, and the CI
        # files that deploy it.
        SERVICES: '^(Services/|Web/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.node-version$|vite\.config\.ts$|tsconfig\.json$|tsconfig\.base\.json$|scripts/generate-api-client$|LilPackage/Sources/Lil/LilAPIGenerated/|\.github/workflows/(pr|main)\.yml$|\.github/actions/(setup-services|changes|comment|check-deploy)/)'
      run: |
        # The diff compares the two commits' trees, so the base alone will do, without its history.
        if [ -n "$BASE" ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null &&
          ! git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
          echo "::notice::Couldn't fetch the base, $BASE, so everything counts as changed."
        fi
        # No base, or one that couldn't be fetched (a run by hand): check everything.
        if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "swift=true" >> "$GITHUB_OUTPUT"
          echo "services=true" >> "$GITHUB_OUTPUT"
          echo "iphone=true" >> "$GITHUB_OUTPUT"
          echo "healthkit=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$BASE" HEAD)
        affected() { if grep -qE "$1" <<< "$files"; then echo true; else echo false; fi; }
        echo "swift=$(affected "$SWIFT")" >> "$GITHUB_OUTPUT"
        echo "services=$(affected "$SERVICES")" >> "$GITHUB_OUTPUT"
        echo "iphone=$(affected "$IPHONE")" >> "$GITHUB_OUTPUT"
        echo "healthkit=$(affected "$HEALTHKIT")" >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"
