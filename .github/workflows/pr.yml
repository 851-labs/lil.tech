name: pull request

# Everything GitHub runs for a pull request. main.yml runs what follows a merge.
# - changes: whether the PR touches the site (`.github/actions/changes`).
# - check: format, lint and type checks (`vp check`).
# - preview: deploys the site (`Web/site`) to a preview stage (pr-<number>) on workers.dev and
#   comments its URL, when the PR touches it.
# - destroy-preview: when the PR closes, destroys its preview stage, if there is one.
# - pr-ok: passes when every other job passed or was skipped. It's the one check the "Protect main"
#   ruleset requires, since the others are skipped when a PR doesn't touch their part. It doesn't
#   require branches to be up to date with main.
#
# Fork PRs: a fork's pull request runs no workflow until a maintainer approves it, and then runs
# its own copy of this file, so the same-repo conditions below only keep an unchanged copy away
# from the deploy token. Never approve a fork's run that changes `.github/`. Previews run PR code
# with the deploy token, and Cloudflare can't limit Workers Scripts:Edit to particular Workers, so
# only branches in this repo get previews (fork PRs get no secrets).

on:
  # No paths filter, so pr-ok always reports, and closing any PR can clean up its preview.
  pull_request:
    types: [opened, synchronize, reopened, closed]

# No run-wide concurrency: cancelling a run would stop a deploy halfway. The deploy and teardown
# share a group per PR, and are never cancelled.

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

defaults:
  run:
    # `shell: bash` runs with `-o pipefail`, so a failing command piped into tee fails the step.
    shell: bash

jobs:
  changes:
    name: determine changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        # Quiets git's hint about the initial branch's name when checkout runs `git init`, and its
        # advice after checking out a commit, as `-c` would. On the checkout steps only, since a
        # workflow's `env` is listed in every step's header. Anchors don't reach other files, so
        # main.yml has the same block.
        env: &quiet-git
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
      - name: determine changes
        id: changes
        uses: ./.github/actions/changes
        with:
          base: ${{ github.event.pull_request.base.sha }}

  check:
    name: check
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        env: *quiet-git
      - name: set up
        uses: ./.github/actions/setup
      - name: format, lint and type check
        run: pnpm exec vp check

  preview:
    name: deploy preview
    needs: changes
    if: >-
      needs.changes.outputs.site == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # One deploy or teardown per PR at a time, never cancelled halfway. A newer push replaces one
    # that's waiting, and so does a teardown.
    concurrency:
      group: pr-site-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      # The concurrency group is per job, so a PR closed right after a push can be torn down
      # before this deploy joins the group. Deploying then would leave a stage nothing destroys.
      - name: check the pr is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
          echo "open=$([ "$state" = open ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$state" = open ] || echo "::notice::The PR is $state, so its preview isn't deployed."
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@v7
        env: *quiet-git
      - name: set up
        if: steps.open.outputs.open == 'true'
        uses: ./.github/actions/setup
      - name: deploy preview stage
        if: steps.open.outputs.open == 'true'
        id: deploy
        working-directory: Web/site
        run: |
          pnpm run deploy --stage "$STAGE" --yes | tee "$RUNNER_TEMP/deploy.log"
          # The stack's output (alchemy.run.ts) ends the log: `  url: 'https://…',`.
          url=$(sed -nE "s/^ *url: '(https:[^']+)'.*/\1/p" "$RUNNER_TEMP/deploy.log" | tail -1)
          if [ -z "$url" ]; then
            echo "error: couldn't find the preview URL in the deploy output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # What the deploy wrote and uploaded (`pnpm run version`).
          echo "version=$(cat public/version.txt)" >> "$GITHUB_OUTPUT"
      - name: check the preview serves this commit
        if: steps.open.outputs.open == 'true'
        uses: ./.github/actions/check-deploy
        with:
          url: ${{ steps.deploy.outputs.url }}
          version: ${{ steps.deploy.outputs.version }}
      - name: comment preview url
        if: steps.open.outputs.open == 'true'
        uses: ./.github/actions/comment
        with:
          pr: ${{ github.event.pull_request.number }}
          marker: "<!-- site-preview -->"
          body: |-
            <!-- site-preview -->
            **Website preview** (`${{ env.STAGE }}`, `${{ steps.deploy.outputs.version }}`): ${{ steps.deploy.outputs.url }}

  destroy-preview:
    name: destroy preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # After a deploy that's still running.
    concurrency:
      group: pr-site-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        env: *quiet-git
      - name: set up
        uses: ./.github/actions/setup
      # Destroying a stage that was never deployed is a no-op.
      - name: destroy preview stage
        id: destroy
        run: pnpm exec alchemy destroy --stage "$STAGE" --yes
        working-directory: Web/site
      # A failed teardown would otherwise only be a red run on a closed PR, and leave the preview
      # behind. One comment, updated on each failed attempt.
      - name: comment if teardown failed
        if: failure() && steps.destroy.outcome == 'failure'
        uses: ./.github/actions/comment
        with:
          pr: ${{ github.event.pull_request.number }}
          marker: "<!-- preview-teardown-failed -->"
          body: |-
            <!-- preview-teardown-failed -->
            **Preview teardown failed** for `${{ env.STAGE }}`, so its Worker is still in Cloudflare: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Fix the cause, then rerun the failed job.

  # The one required check. Runs even when a job it needs failed or the run was cancelled, so it
  # never counts as skipped (which branch protection would take as passed). The "Protect main"
  # ruleset requires it by its name, so renaming it means changing the ruleset too.
  pr-ok:
    name: pr-ok
    if: always()
    needs: [changes, check, preview, destroy-preview]
    runs-on: ubuntu-latest
    steps:
      - name: check every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "These jobs didn't pass:" >&2
            echo "$failed" >&2
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
