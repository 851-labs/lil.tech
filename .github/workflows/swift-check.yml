name: swift

# Lints and tests the Swift code, builds the apps, and checks Pixelbook's manifests and graphs
# (`scripts/check --swift --pixelbook`), on our Mac minis
# (851-2787): they keep their builds between runs, so a run takes minutes, where GitHub's macOS
# runners took 6–11 restoring caches. Moved here from the pre-commit hook (`docs/DECISIONS.md`).
# Called by pr.yml for pull requests and by main.yml for merges, never on its own. Merges also
# snapshot the iPhone's state catalogs in the simulator (`iphone-snapshots`, 851-2953), and so do
# pull requests that touch what they're built from (851-3070), about 3 minutes on another mini.
# Pull requests and merges that touch the iPhone's card engine, the cards' core or conformance
# cases, or the tests themselves, also run the iPhone's HealthKit tests (`iphone-healthkit`,
# 851-3201), about 8 minutes on a mini, half of it granting access in the simulator.
#
# Snapshots are compared with their references within 2 per color channel (851-3242), so the
# references an agent records on a laptop (`scripts/snapshot --record`) pass here. When a state's
# image differs, or a state is new, the job fails and uploads what it rendered
# (`scripts/collect-snapshots`, 851-3070): `snapshot-references`, which `scripts/fetch-snapshots`
# copies into the branch, and `snapshot-changes`, the images with their diffs, to look at.
#
# The minis are self-hosted and this repo is public. What keeps a fork's code off them is that a
# fork's pull request runs no workflow until a maintainer approves it (the repo's policy for every
# outside contributor): a fork's PR runs its own copy of the workflows, so pr.yml's same-repo `if:`
# only keeps an unchanged copy off them. Never approve a fork's run that changes `.github/`.

on:
  workflow_call:
    inputs:
      iphone:
        description: Also snapshot the iPhone's state catalogs in the simulator.
        type: boolean
        default: false
      healthkit:
        description: Also run the iPhone's HealthKit tests in the simulator.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # `shell: bash`, with every process a step starts stopped when the runner cancels it (a newer
    # push, a timeout, a run cancelled by hand), or when it ends: the runner itself only signals the
    # step's shell, and its sweep for orphans can't see our scripts on macOS, so a cancelled
    # `scripts/check` went on building beside the next job (`scripts/ci-shell`, 851-4062).
    shell: bash scripts/ci-shell {0}

jobs:
  check:
    name: lint, test and build
    # Shared with Codevisor, in the "Mac minis" runner group.
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 60
    env:
      # Outside the checkout, which is cleaned each run, so the builds stay warm. Main's apart from
      # pull requests', so a branch's leftovers never reach main's check. (A called workflow sees
      # its caller's event.)
      LIL_CHECK_SCRATCH: ${{ github.workspace }}/../lil.tech-check-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      # A state without a reference is recorded, and fails, for `scripts/fetch-snapshots`
      # (`snapshotsOnCI`, 851-3070).
      LIL_SNAPSHOT_CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Native self-hosted runners own their checkouts; no global trust entry is needed.
          set-safe-directory: false

      # The packages need Swift 6.4 or later. Through DEVELOPER_DIR, never `xcode-select`.
      - name: select xcode
        uses: ./.github/actions/select-xcode

      # The minis' disks are shared with Codevisor: builds kept from older Xcodes and branches are
      # started over once they pass 40 GB. The builds also replay compiles from the runner's
      # compilation cache (`scripts/compilation-cache`, 851-3235), which bounds itself at about
      # 20 GB, in `~/Library/Caches/lil.tech/CompilationCache`.
      - name: limit the kept builds
        run: |
          if [ -d "$LIL_CHECK_SCRATCH" ] &&
            [ "$(du -sk "$LIL_CHECK_SCRATCH" | cut -f1)" -gt $((40 * 1024 * 1024)) ]; then
            echo "Starting over: $LIL_CHECK_SCRATCH is over 40 GB"
            rm -rf "$LIL_CHECK_SCRATCH"
          fi

      # For the Pixelbook check: `graphs.ts` needs only Node, no packages.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # The same checks as before every commit used to run, with warnings as errors (`CI=1`), and
      # Pixelbook's graphs and the state catalogs' manifests (`--pixelbook`). The snapshot tests
      # write every image they take to `LIL_SNAPSHOT_OUTPUT`, with a report, as `scripts/snapshot`
      # has them do.
      - name: run swift lint, tests and builds
        env:
          LIL_SNAPSHOT_OUTPUT: ${{ runner.temp }}/snapshots
        run: |
          rm -rf "$LIL_SNAPSHOT_OUTPUT"
          status=0
          scripts/check --swift --pixelbook || status=$?
          scripts/collect-snapshots --check || status=1
          exit "$status"

      # The images that differ from their references, and the references and manifests the tests
      # wrote (new states, stale manifests), for `scripts/fetch-snapshots`, with a summary saying so.
      - name: collect changed snapshots
        if: failure()
        run: |
          rm -rf "$RUNNER_TEMP/snapshot-references" "$RUNNER_TEMP/snapshot-changes"
          scripts/collect-snapshots "$RUNNER_TEMP/snapshot-references" \
            "$RUNNER_TEMP/snapshot-changes" "$RUNNER_TEMP/snapshots"

      - name: upload new references
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-references
          path: ${{ runner.temp }}/snapshot-references
          if-no-files-found: ignore
          retention-days: 14

      - name: upload changed images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-changes
          path: ${{ runner.temp }}/snapshot-changes
          if-no-files-found: ignore
          retention-days: 14

  # The iPhone's state catalogs (`scripts/snapshot --iphone`), in a simulator of the job's own,
  # deleted at the end. Beside `check`, on another mini when one is free. When it fails, it uploads
  # what changed, as `check` does, and every image and log.
  iphone-snapshots:
    name: iphone snapshots
    if: inputs.iphone
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    # Past the script's own worst case (a 30-minute build, three boots and two 10-minute test
    # runs), so it stops and reports before GitHub does, and the cleanup steps still run.
    timeout-minutes: 75
    env:
      # Kept between runs outside the checkout, like `check`'s builds, but apart from them, and
      # main's apart from pull requests'.
      LIL_SNAPSHOT_DERIVED_DATA: ${{ github.workspace }}/../lil.tech-iphone-snapshots-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      LIL_SNAPSHOT_SIMULATOR: lil-snapshots-ci
      # As `check`'s.
      LIL_SNAPSHOT_CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false

      - name: select xcode
        uses: ./.github/actions/select-xcode

      # As `check`'s: started over past 20 GB, since the disks are Codevisor's too.
      - name: limit the kept build
        run: |
          if [ -d "$LIL_SNAPSHOT_DERIVED_DATA" ] &&
            [ "$(du -sk "$LIL_SNAPSHOT_DERIVED_DATA" | cut -f1)" -gt $((20 * 1024 * 1024)) ]; then
            echo "Starting over: $LIL_SNAPSHOT_DERIVED_DATA is over 20 GB"
            rm -rf "$LIL_SNAPSHOT_DERIVED_DATA"
          fi

      # A run that times out is tried again, which would pass against references the first try
      # recorded into the checkout: `--check` fails on any.
      - name: run iphone snapshot tests
        run: |
          status=0
          scripts/snapshot --iphone || status=$?
          scripts/collect-snapshots --check || status=1
          exit "$status"

      # As `check`'s, under names of their own.
      - name: collect changed snapshots
        if: failure()
        run: |
          rm -rf "$RUNNER_TEMP/snapshot-references" "$RUNNER_TEMP/snapshot-changes"
          scripts/collect-snapshots "$RUNNER_TEMP/snapshot-references" \
            "$RUNNER_TEMP/snapshot-changes" LilPackage/.build/snapshots-iphone

      - name: upload new references
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-snapshot-references
          path: ${{ runner.temp }}/snapshot-references
          if-no-files-found: ignore
          retention-days: 14

      - name: upload changed images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-snapshot-changes
          path: ${{ runner.temp }}/snapshot-changes
          if-no-files-found: ignore
          retention-days: 14

      - name: upload images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-snapshots
          path: LilPackage/.build/snapshots-iphone
          retention-days: 7

      - name: delete the simulator
        if: always()
        run: scripts/snapshot --iphone --delete-simulator

  # The iPhone's HealthKit tests (`scripts/test-iphone-healthkit`, 851-3199, 851-3201): the card
  # engine and the cards' conformance cases against a simulator's HealthKit, in a simulator the
  # script makes and always deletes. Beside `check`, on another mini when one is free.
  iphone-healthkit:
    name: iphone healthkit tests
    if: inputs.healthkit
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 45
    env:
      # Kept between runs outside the checkout, like `check`'s builds, but apart from them, and
      # main's apart from pull requests'.
      LIL_HEALTHKIT_DERIVED_DATA: ${{ github.workspace }}/../lil.tech-iphone-healthkit-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false

      - name: select xcode
        uses: ./.github/actions/select-xcode

      # As `check`'s: started over past 20 GB, since the disks are Codevisor's too.
      - name: limit the kept build
        run: |
          if [ -d "$LIL_HEALTHKIT_DERIVED_DATA" ] &&
            [ "$(du -sk "$LIL_HEALTHKIT_DERIVED_DATA" | cut -f1)" -gt $((20 * 1024 * 1024)) ]; then
            echo "Starting over: $LIL_HEALTHKIT_DERIVED_DATA is over 20 GB"
            rm -rf "$LIL_HEALTHKIT_DERIVED_DATA"
          fi

      - name: run healthkit tests
        run: scripts/test-iphone-healthkit

      # The logs and result bundles, with the screenshots of the access sheet.
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-healthkit
          path: LilPackage/.build/healthkit-tests
          retention-days: 7

      # The script deletes its simulator however it ends, unless it's killed first (cancelled by a
      # newer push, or past the timeout, where `scripts/ci-shell` gives its trap 2 seconds): then
      # this does, so no booted simulator stays on the mini.
      - name: delete the simulator
        if: always()
        run: |
          file=LilPackage/.build/healthkit-tests/simulator
          if [ -f "$file" ]; then
            xcrun simctl shutdown "$(cat "$file")" >/dev/null 2>&1 || true
            xcrun simctl delete "$(cat "$file")" >/dev/null 2>&1 || true
          fi
