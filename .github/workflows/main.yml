name: Main

# Everything GitHub runs for a merge to main (851-2826). pr.yml runs what happens before one.
# - changes: which parts the merge touches (`.github/actions/changes`). The jobs below skip the rest.
# - deploy: the TypeScript workspace to staging (api.staging.lil.tech), then prod (api.lil.tech),
#   checking each serves the merge (`scripts/check-deploy`).
# - check: the Swift checks again, on the merged code, and the iPhone's state catalogs in the
#   simulator (`swift-check.yml`).
# - pixelbook: publishes the merge's state catalog images to Pixelbook, and points its main at them.
#
# Nothing here is ever cancelled, so every merge is deployed and checked: jobs that must not
# overlap queue in order (`queue: max` keeps up to 100 waiting, where the default keeps one and
# cancels the rest).

on:
  push:
    branches: [main]
  # Checks main's Swift again. It never deploys.
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.changes.outputs.swift }}
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A run by hand has no `before`, so everything counts as changed.
      - id: changes
        uses: ./.github/actions/changes
        with:
          base: ${{ github.event.before }}

  deploy:
    needs: changes
    if: needs.changes.outputs.services == 'true' && github.event_name == 'push'
    # One deploy at a time, in the order of the merges.
    concurrency:
      group: main-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Staging and prod revoke Sign in with Apple tokens (851-2612). Previews don't get it.
      LIL_APPLE_SIGN_IN_KEY: ${{ secrets.LIL_APPLE_SIGN_IN_KEY }}
      # Staging and prod sign in with Google on the agents' authorization page (851-2850).
      # Previews don't get it.
      LIL_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.LIL_GOOGLE_WEB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-services
      - id: version
        run: echo "version=$(git describe --always --dirty --exclude '*')" >> "$GITHUB_OUTPUT"
      - name: Deploy staging
        run: pnpm run deploy:staging --yes
        working-directory: Services/api
      - name: Check staging serves this commit
        run: scripts/check-deploy https://api.staging.lil.tech "${{ steps.version.outputs.version }}"
      - name: Deploy prod
        run: pnpm run deploy:prod --yes
        working-directory: Services/api
      - name: Check prod serves this commit
        run: scripts/check-deploy https://api.lil.tech "${{ steps.version.outputs.version }}"

  check:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    uses: ./.github/workflows/swift-check.yml
    with:
      iphone: true

  # Publishes the merge's state catalog images to Pixelbook and points main at them
  # (`scripts/pixelbook publish`, 851-2955). They're the catalogs' committed references, read with
  # git, so it needs no Mac and renders nothing. A merge whose catalogs a branch already published
  # (its PR's head, when it was up to date with main) only moves pointers.
  pixelbook:
    if: github.event_name == 'push'
    # In order, so main's pointer doesn't move back.
    concurrency:
      group: main-pixelbook
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All of main, so a late or re-run job can tell its commit is behind main's pointer.
          fetch-depth: 0
      - uses: ./.github/actions/setup-services
      - name: Publish this commit's snapshots and point main at them
        run: scripts/pixelbook publish --ref main
