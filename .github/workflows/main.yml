name: main

# Everything GitHub runs for a merge to main. pr.yml runs what happens before one.
# - changes: whether the merge touches the site (`.github/actions/changes`).
# - deploy: the site (`Web/site`) to staging (staging.lil.tech), then prod (lil.tech), checking
#   each serves the merge (`.github/actions/check-deploy`).
#
# Nothing here is ever cancelled, so every merge is deployed: deploys queue in the order of the
# merges (`queue: max` keeps up to 100 waiting, where the default keeps one and cancels the rest).

on:
  push:
    branches: [main]
  # Deploys main again, whatever changed.
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: determine changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        # Quiets git's hint about the initial branch's name when checkout runs `git init`, and its
        # advice after checking out a commit, as `-c` would. On the checkout steps only, since a
        # workflow's `env` is listed in every step's header. Anchors don't reach other files, so
        # pr.yml has the same block.
        env: &quiet-git
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: "false"
      # A run by hand has no `before`, so everything counts as changed.
      - name: determine changes
        id: changes
        uses: ./.github/actions/changes
        with:
          base: ${{ github.event.before }}

  deploy:
    name: deploy staging and prod
    needs: changes
    if: needs.changes.outputs.site == 'true'
    # One deploy at a time, in the order of the merges.
    concurrency:
      group: main-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        env: *quiet-git
      - name: set up
        uses: ./.github/actions/setup
      - name: deploy staging
        id: staging
        working-directory: Web/site
        run: |
          pnpm run deploy:staging --yes
          # What the deploy wrote and uploaded (`pnpm run version`).
          echo "version=$(cat public/version.txt)" >> "$GITHUB_OUTPUT"
      - name: check staging serves this commit
        uses: ./.github/actions/check-deploy
        with:
          url: https://staging.lil.tech
          version: ${{ steps.staging.outputs.version }}
      - name: deploy prod
        id: prod
        working-directory: Web/site
        run: |
          pnpm run deploy:prod --yes
          echo "version=$(cat public/version.txt)" >> "$GITHUB_OUTPUT"
      - name: check prod serves this commit
        uses: ./.github/actions/check-deploy
        with:
          url: https://lil.tech
          version: ${{ steps.prod.outputs.version }}
