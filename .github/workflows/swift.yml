name: Swift

# Lints and tests the Swift code, and builds the apps (`scripts/check --swift`), on our Mac minis
# (851-2787): they keep their builds between runs, so a run takes minutes, where GitHub's macOS
# runners took 6–11 restoring caches. Moved here from the pre-commit hook (`docs/DECISIONS.md`).

on:
  pull_request:
    paths:
      - "LilPackage/**"
      - "Apps/**"
      - "Tools/**"
      - "Lil.xcworkspace/**"
      - ".swift-format"
      - "scripts/format"
      - "scripts/check"
      - ".github/workflows/swift.yml"
  push:
    branches: [main]
    paths:
      - "LilPackage/**"
      - "Apps/**"
      - "Tools/**"
      - "Lil.xcworkspace/**"
      - ".swift-format"
      - "scripts/format"
      - "scripts/check"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    # The runners are ours, and the repo is public: never run code from a fork's pull request on
    # them. Fork PRs also need approval from a maintainer before any workflow runs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Shared with Codevisor, in the "Mac minis" runner group.
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 60
    env:
      # Outside the checkout, which is cleaned each run, so the builds stay warm.
      LIL_CHECK_SCRATCH: ${{ github.workspace }}/../lil.tech-check
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          # Native self-hosted runners own their checkouts; no global trust entry is needed.
          set-safe-directory: false

      # Not `xcode-select`, which would change the machine for Codevisor's jobs too. The packages
      # need Swift 6.4, so Xcode 27.
      - name: Select Xcode
        run: |
          for developer_dir in /Applications/Xcode.app/Contents/Developer /Applications/Xcode*.app/Contents/Developer; do
            if [[ -x "$developer_dir/usr/bin/xcodebuild" ]] &&
              DEVELOPER_DIR="$developer_dir" xcrun swift --version 2>/dev/null | grep -q "Swift version 6\.[4-9]"; then
              echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
              DEVELOPER_DIR="$developer_dir" xcodebuild -version
              exit 0
            fi
          done
          echo "Needs an Xcode with Swift 6.4 or later under /Applications." >&2
          exit 1

      # The same checks as before every commit used to run, with warnings as errors (`CI=1`).
      - name: Check
        run: scripts/check --swift
