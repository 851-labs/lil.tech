name: Probe 851-3230 (temporary)

# TEMPORARY, removed before merging: runs the Mac snapshot suite several times on a mini, to catch
# Sleep's toolbar chevron drawn apart (851-3230), dumping the title bar's layers.

on:
  push:
    branches:
      - alexandru/851-3230-snapshot-tests-sleeps-previous-period-chevron-sometimes

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: probe-3230
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, codevisor-macos-arm64]
    timeout-minutes: 60
    env:
      SCRATCH: ${{ github.workspace }}/../lil.tech-check-pr/package
      LIL_SNAPSHOT_CI: "1"
      PROBE_RUNS: "8"
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false
      - uses: ./.github/actions/select-xcode
      - name: Build
        run: cd LilPackage && swift build --build-tests --quiet --scratch-path "$SCRATCH"
      - name: The Mac snapshot suite, in fresh processes
        run: |
          cd LilPackage
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$RUNNER_TEMP/out"/* "$RUNNER_TEMP/runs"
          fails=0
          for run in $(seq "$PROBE_RUNS"); do
            start=$(date +%s)
            LIL_PROBE_DUMP="$RUNNER_TEMP/out/dump-$run.txt" \
              LIL_SNAPSHOT_OUTPUT="$RUNNER_TEMP/runs/$run" swift test --skip-build \
              --scratch-path "$SCRATCH" --filter 'HealthSnapshotTests\.MacSnapshotTests' \
              --skip sleepToolbarProbe --skip sleepChevronTiming > "$RUNNER_TEMP/out/run-$run.log" 2>&1 || true
            failed=$(grep -c '^✘ Test .*recorded an issue' "$RUNNER_TEMP/out/run-$run.log" || true)
            echo "run $run: $(( $(date +%s) - start )) s, failures: $failed, load: $(sysctl -n vm.loadavg)"
            grep '^✘ Test .*recorded an issue' "$RUNNER_TEMP/out/run-$run.log" || true
            [ "$failed" -gt 0 ] && fails=$((fails + 1))
            find "$RUNNER_TEMP/runs/$run" -name '*.diff.png' | while IFS= read -r diff; do
              cp "$diff" "$RUNNER_TEMP/out/run$run-$(basename "$diff")"
              cp "${diff%.diff.png}.png" "$RUNNER_TEMP/out/run$run-$(basename "${diff%.diff.png}").png"
            done
          done
          echo "Runs with a failure: $fails of $PROBE_RUNS"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe
          path: ${{ runner.temp }}/out
          retention-days: 3
