packages:
  # Web projects; a folder with a package.json joins.
  - Web/*

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.4
  "@types/node": ^24
  alchemy: 2.0.0-beta.83
  effect: 4.0.4
  typescript: ^7.0.2
  vite-plus: 1.1.0

overrides:
  # Vite+ ships its own Vite build. Point every `vite` at it.
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
peerDependencyRules:
  allowedVersions:
    # Vite+ core reports its own version (1.x), which satisfies a `vite` peer.
    vite: "*"
    # Alchemy's capnp-es (Worker config encoding) declares TypeScript 5/6; it runs fine with 7.
    capnp-es>typescript: "*"
allowBuilds:
  # Alchemy's dependencies. workerd downloads the local Workers runtime (`alchemy dev`). esbuild's
  # binary comes as an optional dependency, so its install script (which only checks for the
  # binary) isn't needed. Deciding keeps pnpm from failing the install over them.
  workerd: true
  esbuild: false
