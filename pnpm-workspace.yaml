packages:
  - Services/api

catalogMode: prefer

catalog:
  "@effect/platform-node": 4.0.4
  "@effect/sql-d1": 4.0.4
  "@effect/sql-sqlite-node": 4.0.4
  "@effect/vitest": 4.0.4
  "@types/node": ^24
  alchemy: 2.0.0-beta.83
  effect: 4.0.4
  jose: 6.2.12
  typescript: ^7.0.2
  vite-plus: 1.1.0

overrides:
  # Vite+ ships its own Vite build. Point every `vite` at it so @effect/vitest
  # and `vp test` share one Vitest instance.
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
peerDependencyRules:
  allowedVersions:
    # Vite+ core reports its own version (1.x), which satisfies Vitest's `vite` peer.
    vite: "*"
    # Alchemy's capnp-es (Worker config encoding) declares TypeScript 5/6; it runs fine with 7.
    capnp-es>typescript: "*"
allowBuilds:
  # Downloads the local Workers runtime used by `alchemy dev`.
  workerd: true
